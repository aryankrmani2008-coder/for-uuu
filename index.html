<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Payal ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    .welcome-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      font-size: 28px;
      color: #e75480;
    }

    p {
      font-size: 18px;
      margin-top: 15px;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .heart {
      font-size: 40px;
      color: #e75480;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .nav-arrows {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .arrow {
      font-size: 40px;
      color: #e75480;
      text-decoration: none;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .arrow:hover {
      transform: scale(1.2);
      color: #ff3366;
    }
  </style>
</head>
<body>
  <div class="welcome-box">
    <h1>Hii Payal ❤️</h1>
    <p> main Aryan 😊<br>
    Ye maine banaya hai thoda bahut AI se 😁<br>
    Ek baar dekh lena plzzz</p>
    <div class="heart">❤️</div>

    <!-- Navigation arrow -->
    <div class="nav-arrows">
      <a href="page2.html" class="arrow">➜</a>
    </div>
  </div>
</body>
</html>
